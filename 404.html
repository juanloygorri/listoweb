<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — ListoWeb</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF5A3C'/%3E%3Cpath d='M9 16.5l4.6 4.6L23 11.4' stroke='%23fff' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
      display:grid;place-items:center;position:relative;isolation:isolate;
      background:#08090A;color:#fff;text-align:center;padding:2rem;
      font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6;
    }
    body::before{
      content:'';position:absolute;inset:0;z-index:-1;
      background:
        radial-gradient(55% 50% at 75% 10%,rgba(255,90,60,.30),transparent 62%),
        radial-gradient(45% 45% at 8% 90%,rgba(18,179,159,.22),transparent 66%);
    }
    .mark{width:56px;height:56px;margin:0 auto 28px;}
    .code{
      font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:700;
      letter-spacing:.18em;text-transform:uppercase;color:#FFA53B;margin-bottom:14px;
    }
    h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.7rem,5vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1.15;}
    p{margin-top:.8rem;color:rgba(255,255,255,.62);max-width:44ch;margin-left:auto;margin-right:auto;}
    a.btn{
      display:inline-flex;align-items:center;gap:9px;margin-top:30px;padding:15px 30px;border-radius:999px;
      background:linear-gradient(135deg,#FF5A3C,#FF7A3C);color:#fff;text-decoration:none;font-weight:600;
      box-shadow:0 16px 34px -12px rgba(255,90,60,.5);transition:transform .25s ease;
    }
    a.btn:hover{transform:translateY(-3px);}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FF5A3C"/><stop offset="100%" stop-color="#FFA53B"/>
        </linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#g)"/>
        <path d="M9 16.5l4.6 4.6L23 11.4" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="code">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>La dirección es incorrecta o el sitio todavía no está publicado.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </main>
</body>
</html>
